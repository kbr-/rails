name = "rails"
version = "0.1.0"
defaultTargets = ["Rails", "rails-extract", "rails-check"]
testDriver = "rails_tests"

[[require]]
name = "lean-spec-tools"
path = "../lean-spec-tools"

[[lean_lib]]
name = "Rails"

[[lean_exe]]
name = "rails-extract"
root = "RailsExtract"

[[lean_exe]]
name = "rails-check"
root = "RailsCheck"

[[lean_exe]]
name = "rails_tests"
root = "RailsTests"
